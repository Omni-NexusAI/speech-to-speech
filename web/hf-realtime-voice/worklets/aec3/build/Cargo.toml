[package]
name = "hfrt-sonora-aec3-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
sonora = { git = "https://github.com/dignifiedquire/sonora.git", rev = "a024d6ef8351add55be5e8b1d6cc35f555787660" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
